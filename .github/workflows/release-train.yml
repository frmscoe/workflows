# SPDX-License-Identifier: Apache-2.0

# Central reusable workflow: prepares a release PR from dev to main for package repos.
#
# Version policies:
#   aligned     - package.json is set to the platform release version (e.g. 4.0.0).
#   independent - package.json keeps its own semver; only the prerelease suffix is stripped.
#
# The platform release version always names the release PR branch (release/v4.0.0).
# It also resolves internal @frmscoe/@tazama-lf rc dependencies to stable versions.

name: Release train

permissions:
  contents: write
  pull-requests: write

on:
  workflow_call:
    inputs:
      version:
        description: "Platform release version (e.g. 4.0.0). Names the release PR branch and aligned package bumps."
        required: false
        type: string
        default: ""
      version_policy:
        description: "aligned sets package.json to the platform version; independent keeps the repo's own semver."
        required: false
        type: string
        default: "aligned"
      source_branch:
        required: false
        type: string
        default: dev
      target_branch:
        required: false
        type: string
        default: main
      package_scope:
        required: false
        type: string
        default: "@frmscoe"
      node_version:
        required: false
        type: string
        default: "22"
      internal_scopes_regex:
        required: false
        type: string
        default: "^@(tazama-lf|frmscoe)/"
      version_mismatch_behavior:
        required: false
        type: string
        default: fail
      reviewer:
        required: false
        type: string
        default: ""
    secrets:
      GH_TOKEN_LIB:
        required: true
      GH_USERNAME:
        required: false

  workflow_dispatch:
    inputs:
      version:
        description: "Platform release version (e.g. 4.0.0). Leave blank to use RELEASE_VERSION, then package.json."
        required: false
        default: ""
      version_policy:
        description: "aligned or independent"
        required: false
        default: "aligned"
      source_branch:
        required: false
        default: dev
      target_branch:
        required: false
        default: main
      package_scope:
        required: false
        default: "@frmscoe"
      node_version:
        required: false
        default: "22"
      internal_scopes_regex:
        required: false
        default: "^@(tazama-lf|frmscoe)/"
      version_mismatch_behavior:
        required: false
        default: fail
      reviewer:
        required: false
        default: ""

jobs:
  prepare-release:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate release-train source branch
        shell: bash
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch || vars.SOURCE_BRANCH || 'dev' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "$SOURCE_BRANCH" ]; then
            echo "::error::Release train must run from '$SOURCE_BRANCH'. Current branch/ref is '${GITHUB_REF_NAME}'."
            echo "Run release-train from dev/source branch so it can prepare the release branch and PR to main."
            exit 1
          fi

      - name: Checkout source branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.source_branch || vars.SOURCE_BRANCH || 'dev' }}
          token: ${{ secrets.GH_TOKEN_LIB }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: ${{ inputs.node_version || vars.NODE_VERSION || '22' }}
          registry-url: 'https://npm.pkg.github.com/'
          scope: ${{ inputs.package_scope || vars.PACKAGE_SCOPE || '@frmscoe' }}

      - name: Set up GitHub Packages authentication
        shell: bash
        env:
          GH_TOKEN_LIB: ${{ secrets.GH_TOKEN_LIB }}
        run: |
          set -euo pipefail
          echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN_LIB}" >> ~/.npmrc
          echo "@frmscoe:registry=https://npm.pkg.github.com/" >> ~/.npmrc
          echo "@tazama-lf:registry=https://npm.pkg.github.com/" >> ~/.npmrc

      - name: Resolve and validate target version
        id: version
        shell: bash
        env:
          VERSION_INPUT: ${{ inputs.version || vars.RELEASE_VERSION || '' }}
          VERSION_POLICY: ${{ inputs.version_policy || vars.PACKAGE_VERSION_POLICY || 'aligned' }}
          MISMATCH_BEHAVIOR: ${{ inputs.version_mismatch_behavior || vars.VERSION_MISMATCH_BEHAVIOR || 'fail' }}
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            echo "::error::release-train.yml is for package repos and requires package.json. Use dev-to-main-pr.yml for non-code repos."
            exit 1
          fi

          RAW_PACKAGE_VERSION=$(jq -r '.version // empty' package.json)
          if [ -z "$RAW_PACKAGE_VERSION" ] || [ "$RAW_PACKAGE_VERSION" = "null" ]; then
            echo "::error::package.json exists but .version is missing"
            exit 1
          fi

          PACKAGE_STABLE_VERSION="${RAW_PACKAGE_VERSION%%-*}"

          if [ -n "$VERSION_INPUT" ]; then
            PLATFORM_VERSION="${VERSION_INPUT%%-*}"
            if [ "$VERSION_INPUT" != "$PLATFORM_VERSION" ]; then
              echo "::warning::Platform version input '$VERSION_INPUT' contained a prerelease suffix. Using '$PLATFORM_VERSION'."
            fi
          else
            PLATFORM_VERSION="$PACKAGE_STABLE_VERSION"
          fi

          if ! [[ "$PLATFORM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Platform release version '$PLATFORM_VERSION' is not valid semver X.Y.Z."
            exit 1
          fi

          case "$VERSION_POLICY" in
            independent)
              PACKAGE_VERSION_TO_SET="$PACKAGE_STABLE_VERSION"
              echo "Independent package policy: npm version will remain ${PACKAGE_VERSION_TO_SET}; platform release is ${PLATFORM_VERSION}."
              ;;
            aligned)
              PACKAGE_VERSION_TO_SET="$PLATFORM_VERSION"
              if [ "$PACKAGE_STABLE_VERSION" != "$PLATFORM_VERSION" ]; then
                echo "::warning::package.json version '$RAW_PACKAGE_VERSION' resolves to '$PACKAGE_STABLE_VERSION' but platform release is '$PLATFORM_VERSION'."
                if [ "$MISMATCH_BEHAVIOR" = "fail" ]; then
                  exit 1
                fi
              fi
              ;;
            *)
              echo "::error::Unknown version_policy '$VERSION_POLICY'. Use 'independent' or 'aligned'."
              exit 1
              ;;
          esac

          if ! [[ "$PACKAGE_VERSION_TO_SET" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Package version '$PACKAGE_VERSION_TO_SET' is not valid semver X.Y.Z."
            exit 1
          fi

          echo "raw_package_version=$RAW_PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "platform_version=$PLATFORM_VERSION" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION_TO_SET" >> "$GITHUB_OUTPUT"
          echo "target_version=$PACKAGE_VERSION_TO_SET" >> "$GITHUB_OUTPUT"
          echo "release_branch=release/v${PLATFORM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Platform release: $PLATFORM_VERSION"
          echo "Package version to set: $PACKAGE_VERSION_TO_SET"

      - name: Resolve internal rc dependencies to stable
        id: resolve_deps
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN_LIB }}
          INTERNAL_SCOPES_REGEX: ${{ inputs.internal_scopes_regex || vars.INTERNAL_SCOPES_REGEX || '^@(tazama-lf|frmscoe)/' }}
        run: |
          set -euo pipefail
          CHANGED=0
          PKG=$(cat package.json)

          for DEP_FIELD in dependencies devDependencies peerDependencies optionalDependencies; do
            KEYS=$(echo "$PKG" | jq -r ".${DEP_FIELD} // {} | keys[]" | grep -E "$INTERNAL_SCOPES_REGEX" || true)
            for KEY in $KEYS; do
              CURRENT=$(echo "$PKG" | jq -r ".${DEP_FIELD}[\"${KEY}\"]")
              echo "Checking ${DEP_FIELD}.${KEY} = ${CURRENT}"

              if [[ "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z] ]]; then
                LATEST=$(npm view "${KEY}" dist-tags.latest 2>/dev/null || true)
                if [ -z "$LATEST" ]; then
                  echo "::error::Cannot resolve stable version for ${KEY} (pinned rc: ${CURRENT})"
                  exit 1
                fi
                if [[ "$LATEST" == *-* ]]; then
                  echo "::error::${KEY}@latest is '${LATEST}' and is still prerelease. Publish stable dependency first."
                  exit 1
                fi
                echo "  -> ${KEY}: ${CURRENT} -> ${LATEST}"
                PKG=$(echo "$PKG" | jq ".${DEP_FIELD}[\"${KEY}\"] = \"${LATEST}\"")
                CHANGED=1

              elif [[ "$CURRENT" =~ ^[\^~][0-9]+\.[0-9]+\.[0-9]+-[a-zA-Z] ]]; then
                RANGE_CHAR="${CURRENT:0:1}"
                BASE="${CURRENT:1}"
                STABLE_BASE="${BASE%%-*}"
                NEW_RANGE="${RANGE_CHAR}${STABLE_BASE}"
                LATEST=$(npm view "${KEY}" dist-tags.latest 2>/dev/null || true)
                if [ -z "$LATEST" ]; then
                  echo "::error::Cannot resolve stable version for ${KEY} (range with rc: ${CURRENT})"
                  exit 1
                fi
                if [[ "$LATEST" == *-* ]]; then
                  echo "::error::${KEY}@latest is '${LATEST}' and is still prerelease. Publish stable dependency first."
                  exit 1
                fi
                echo "  -> ${KEY}: ${CURRENT} -> ${NEW_RANGE}"
                PKG=$(echo "$PKG" | jq ".${DEP_FIELD}[\"${KEY}\"] = \"${NEW_RANGE}\"")
                CHANGED=1

              else
                echo "  ok: no rc dependency rewrite needed"
              fi
            done
          done

          echo "$PKG" | jq '.' > package.json
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Update package version to stable
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.package_version }}"
          jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "package.json version set to $VERSION"

      - name: Regenerate package-lock.json if present
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN_LIB }}
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm install --package-lock-only
          else
            echo "No package-lock.json found. Skipping lockfile regeneration."
          fi

      - name: Commit and push release branch
        id: push_branch
        shell: bash
        env:
          GH_API_TOKEN: ${{ secrets.GH_TOKEN_LIB }}
          SOURCE_BRANCH: ${{ inputs.source_branch || vars.SOURCE_BRANCH || 'dev' }}
          PLATFORM_VERSION: ${{ steps.version.outputs.platform_version }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          RELEASE_BRANCH: ${{ steps.version.outputs.release_branch }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          API="repos/${REPO}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$RELEASE_BRANCH"
          git add package.json package-lock.json 2>/dev/null || git add package.json

          if git diff --cached --quiet; then
            echo "No package changes to commit. Release branch will point at ${SOURCE_BRANCH}."
          else
            git commit -m "chore: prepare platform release v${PLATFORM_VERSION} (package ${PACKAGE_VERSION})"
          fi

          git push "https://x-access-token:${GH_API_TOKEN}@github.com/${REPO}.git" "$RELEASE_BRANCH" --force
          echo "branch=$RELEASE_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open PR to target branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_LIB }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          TARGET_BRANCH: ${{ inputs.target_branch || vars.TARGET_BRANCH || 'main' }}
          REVIEWER_INPUT: ${{ inputs.reviewer || vars.RELEASE_REVIEWER || '' }}
        run: |
          set -euo pipefail
          PLATFORM_VERSION="${{ steps.version.outputs.platform_version }}"
          PACKAGE_VERSION="${{ steps.version.outputs.package_version }}"
          BRANCH="${{ steps.push_branch.outputs.branch }}"

          printf "## Platform release v%s\n\nThis PR was prepared automatically by the central release-train workflow.\n\n**Changes:**\n- Source package version: %s\n- npm package version after merge: %s\n- Platform GitHub release tag after merge: v%s\n- Resolves internal rc dependencies to stable versions where required\n- Regenerates package-lock.json when present\n\n**After merge:**\n- publish.yml publishes npm package version %s.\n- release.yml creates GitHub release/tag v%s.\n\nPlease review the package and dependency changes before approving.\n" \
            "$PLATFORM_VERSION" "${{ steps.version.outputs.raw_package_version }}" "$PACKAGE_VERSION" "$PLATFORM_VERSION" "$PACKAGE_VERSION" "$PLATFORM_VERSION" > /tmp/pr-body.md

          EXISTING=$(gh pr list --head "$BRANCH" --base "$TARGET_BRANCH" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #${EXISTING} already exists for $BRANCH -> $TARGET_BRANCH."
            exit 0
          fi

          REVIEWER="${REVIEWER_INPUT:-${GH_USERNAME:-}}"
          REVIEWER_ARGS=()
          if [ -n "$REVIEWER" ]; then
            REVIEWER_ARGS=(--reviewer "$REVIEWER")
          fi

          gh pr create \
            --title "release: v${PLATFORM_VERSION}" \
            --body-file /tmp/pr-body.md \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            "${REVIEWER_ARGS[@]}"
